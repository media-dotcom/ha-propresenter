name: "Lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
        - name: "Checkout the repository"
          uses: "actions/checkout@v5.0.0"

        - name: "Set up Python"
          uses: actions/setup-python@v6.0.0
          with:
            python-version: "3.13"
            cache: "pip"

        - name: "Install requirements"
          run: python3 -m pip install -r requirements.txt

        - name: "Lint"
          run: python3 -m ruff check .

        - name: "Format"
          run: python3 -m ruff format . --check

        - name: "Pure backend tests"
          run: PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py'

  dashboard-card:
    name: "Dashboard card"
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: dashboard-card
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v5.0.0"

      - name: "Set up Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-card/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Typecheck"
        run: npm run typecheck

      - name: "Test"
        run: npm test

      - name: "Build bundled card asset"
        run: npm run build
